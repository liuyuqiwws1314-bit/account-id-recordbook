  <style>
    @media (min-width:701px){
      html,body{height:100%;overflow:hidden}
      body{display:grid;place-items:center}
      .shell{width:min(100vw,177.7778vh,1280px);height:min(100vh,56.25vw,720px);aspect-ratio:16/9;display:flex;flex-direction:column;padding:24px 30px 22px}

      main{display:flex;flex:1;min-height:0;flex-direction:column}
      .hero{margin-bottom:16px}
      h1{font-size:32px}
      .stats{margin-bottom:15px}
      .panel{display:flex;flex:1;min-height:0;flex-direction:column}
      .table-wrap{flex:1;min-height:0;overflow:auto}

    @media (max-width:700px){
      html,body{height:auto;min-height:100%;overflow-x:hidden}
      .shell{width:auto;height:auto;aspect-ratio:auto;display:block}
      .panel{display:block}
      .table-wrap{overflow:visible}
      table{display:block;width:100%;min-width:0}
      thead{display:none}
      tbody{display:grid;gap:10px;padding:12px}
      tbody tr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff}
      tbody tr:hover{background:#fff}
      tbody td{display:block;width:auto!important;padding:0!important;border:0;text-align:left!important}
      tbody td:first-child{grid-column:1;grid-row:1}
      tbody td:nth-child(2){grid-column:1/-1;grid-row:2;display:flex;gap:9px;align-items:baseline}
      tbody td:nth-child(2)::before{content:"账号 ID";font-size:11px;color:var(--muted);white-space:nowrap}
      tbody td:nth-child(3){grid-column:1/-1;grid-row:3;display:flex;gap:9px;align-items:baseline}
      tbody td:nth-child(3)::before{content:"账号名称";font-size:11px;color:var(--muted);white-space:nowrap}
      tbody td:nth-child(4){grid-column:1/-1;grid-row:4;display:flex;gap:9px;align-items:baseline}
      tbody td:nth-child(4)::before{content:"抓取时间";font-size:11px;color:var(--muted);white-space:nowrap}
      tbody td:last-child{grid-column:2;grid-row:1;align-self:center}
      th:first-child,td:first-child{width:auto;padding-left:0}
      th:last-child,td:last-child{width:auto;padding-right:0}
    }
  </style>

    try{const stored=localStorage.getItem(STORE_KEY);records=stored?JSON.parse(stored):SHARE_RECORDS.map(r=>({...r}));if(!Array.isArray(records))records=SHARE_RECORDS.map(r=>({...r}));}catch{records=SHARE_RECORDS.map(r=>({...r}));}

    const $=id=>document.getElementById(id);
    const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function save(){localStorage.setItem(STORE_KEY,JSON.stringify(records));}
    function render(){
      const q=$('searchInput').value.trim().toLowerCase();
      const filtered=records.map((r,i)=>({...r,number:i+1})).filter(r=>(r.id+' '+r.name).toLowerCase().includes(q));
      const totalPages=Math.max(1,Math.ceil(filtered.length/PAGE_SIZE));currentPage=Math.min(currentPage,totalPages);
      const start=(currentPage-1)*PAGE_SIZE,visible=filtered.slice(start,start+PAGE_SIZE);
      $('totalCount').textContent=records.length.toLocaleString('zh-CN');
      $('countPill').textContent=`${records.length} 条记录`;
      const latest=records.map(r=>r.date).filter(Boolean).sort().at(-1);
      $('latestDate').textContent=latest?latest.replaceAll('-','.').slice(2):'—';
      $('rangeText').textContent=filtered.length?`显示 ${start+1}–${Math.min(start+PAGE_SIZE,filtered.length)} 条，共 ${filtered.length} 条`:'共 0 条记录';
      $('pageLabel').textContent=`第 ${currentPage} / ${totalPages} 页`;$('prevPage').disabled=currentPage===1;$('nextPage').disabled=currentPage===totalPages;
      $('rows').innerHTML=visible.map(r=>`<tr><td><span class="row-number">${r.number}</span></td><td><span class="id-text">${esc(r.id)}</span></td><td><span class="name">${esc(r.name)}</span></td><td><span class="date">${esc(r.date||'—')}</span></td><td><button class="copy-btn" data-copy="${esc(r.id)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>复制 ID</button></td></tr>`).join('');
      const isEmpty=filtered.length===0;$('empty').hidden=!isEmpty;$('rows').closest('table').style.display=isEmpty?'none':'';
      $('emptyTitle').textContent=q?'没有找到匹配的账号':'还没有账号记录';$('emptyHint').textContent=q?'试试其他 ID 或账号名称。':'添加第一条记录，序号将从 1 开始。';
    }

    function modal(open){$('overlay').classList.toggle('open',open);if(open){$('scrapeDate').value=today();setTimeout(()=>$('accountId').focus(),50);}}

    $('exportBtn').addEventListener('click',()=>{if(!records.length){toast('还没有可导出的记录');return;}const csv='序号,账号 ID,账号名称,抓取时间\r\n'+records.map((r,i)=>[i+1,r.id,r.name,r.date].map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='账号ID记录.csv';a.click();URL.revokeObjectURL(a.href);toast('记录已导出');});
